<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport PDF — Audit 5S</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <!-- jsPDF : essayer plusieurs CDN, sinon utiliser la copie locale -->
    <!-- Option 1 : jsdelivr -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <!-- Si aucun CDN ne marche, télécharger depuis https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js
         et le mettre dans le repo sous ./jspdf.umd.min.js -->
    <script>
        if (typeof window.jspdf === 'undefined') {
            // Fallback : copie locale
            var s = document.createElement('script');
            s.src = './jspdf.umd.min.js';
            document.head.appendChild(s);
        }
    </script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;padding:20px;color:#333;max-width:700px;margin:0 auto}
        h1{font-size:1.3rem;margin-bottom:4px}
        .sub{color:#777;font-size:.85rem;margin-bottom:16px}
        .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid #e0e0e0}
        button{background:#FFED00;border:none;padding:8px 18px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.85rem}
        button:hover{background:#E6D600}
        button:disabled{opacity:.5;cursor:not-allowed}
        .s{padding:6px 10px;border-radius:5px;margin:3px 0;font-size:.82rem;font-family:Consolas,monospace}
        .s.ok{background:#e6f9ed;color:#00754a}.s.err{background:#fde8ee;color:#c4002f}
        .s.info{background:#e8f0fe;color:#1a5276}
        .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;min-width:300px}
        .audit-card{padding:10px;border:1px solid #eee;border-radius:6px;margin:6px 0;cursor:pointer;transition:background .15s}
        .audit-card:hover{background:#f9f9f0}
        .audit-card.selected{background:#FFED00;border-color:#E6D600}
        .preview{margin-top:12px;padding:12px;background:#fafafa;border-radius:6px;border:1px solid #eee;font-size:.82rem}
        .preview h4{margin-bottom:6px}
        .score-bar{height:8px;border-radius:4px;background:#eee;margin:4px 0}
        .score-fill{height:100%;border-radius:4px;transition:width .3s}
        #pdf-preview{margin-top:12px;width:100%;border:1px solid #ddd;border-radius:6px;min-height:200px;display:none}
    </style>
</head>
<body>
    <h1>📄 Rapport PDF — Fiche synthèse Audit 5S</h1>
    <p class="sub">Lit un audit depuis la liste Audits5S et génère une fiche synthèse 1 page en PDF.</p>

    <div class="card">
        <div class="flex">
            <button id="btn-connect" onclick="connect()">Se connecter</button>
            <span id="auth-status" class="s info">Non connecté</span>
        </div>
    </div>

    <div class="card">
        <h3 style="font-size:.95rem;margin-bottom:8px">Sélectionner un audit</h3>
        <button id="btn-load" onclick="loadAudits()" disabled>Charger les audits récents</button>
        <div id="audits-list" style="margin-top:10px"></div>
    </div>

    <div class="card" id="detail-card" style="display:none">
        <h3 style="font-size:.95rem;margin-bottom:8px">Aperçu</h3>
        <div id="audit-detail"></div>
        <div style="margin-top:12px">
            <button id="btn-pdf" onclick="generatePDF()" disabled>Générer le PDF</button>
        </div>
    </div>

    <iframe id="pdf-preview"></iframe>

<script>
// ── Config ──
const SITE_ID = 'sartorius.sharepoint.com,ec2b83d2-7066-467c-83e6-fa97ca5db8e3,a833e672-c3d7-4db5-92c0-6169773c2516';
const LIST_IDS = {
    audits:  'fb669de2-4d64-49c7-a1cb-50a3b7ed79dc',
    actions: 'aa10c625-373c-4d14-859a-3b468470cc3f'
};

const COL_AUDITS = {
    auditId:'Title', date:'Date', auditeur:'Auditeur', auditeurLookupId:'AuditeurLookupId',
    auditeurEmail:'AuditeurEmail', zone:'Zone', niveau:'Niveau',
    s1_1:'S1_1',s1_2:'S1_2',s1_3:'S1_3',s2_1:'S2_1',s2_2:'S2_2',s2_3:'S2_3',
    s3_1:'S3_1',s3_2:'S3_2',s3_3:'S3_3',s4_1:'S4_1',s4_2:'S4_2',s4_3:'S4_3',
    s5_1:'S5_1',s5_2:'S5_2',s5_3:'S5_3',
    scoreTotal:'ScoreTotal', scorePct:'ScorePct', commentaire:'Commentaire'
};
const COL_ACTIONS = {
    actionId:'Title', dateCreation:'Date', zone:'Zone',
    critere:'Crit_x00e8_re', type:'TypeAction', description:'Description',
    responsable:'Responsable', responsableLookupId:'ResponsableLookupId',
    statut:'Statut', dateCloture:'DateCloture', commentaireCloture:'CommentaireCloture'
};

const S_NAMES = ['Seiri — Trier','Seiton — Ranger','Seiso — Nettoyer','Seiketsu — Standardiser','Shitsuke — Respecter'];
const S_SHORT = ['S1','S2','S3','S4','S5'];

const msalConfig = {
    auth:{clientId:'d97a32d2-865c-480b-96c2-1cfdcea3636c',authority:'https://login.microsoftonline.com/sartorius.com',redirectUri:location.origin+location.pathname},
    cache:{cacheLocation:'sessionStorage'}
};
const loginRequest = {scopes:['Sites.ReadWrite.All']};
let msalInstance, msalAccount;
let auditsData = [];
let selectedAudit = null;
let selectedActions = [];

(async()=>{
    msalInstance=new msal.PublicClientApplication(msalConfig);
    await msalInstance.initialize();
    const a=msalInstance.getAllAccounts();
    if(a.length>0){msalAccount=a[0];onAuth();}
})();

async function connect(){
    try{const r=await msalInstance.loginPopup(loginRequest);msalAccount=r.account;onAuth();}catch(e){alert(e.message);}
}
function onAuth(){
    el('auth-status').textContent='✓ '+msalAccount.username;
    el('auth-status').className='s ok';
    el('btn-load').disabled=false;
}
async function getToken(){
    return(await msalInstance.acquireTokenSilent({scopes:loginRequest.scopes,account:msalAccount})).accessToken;
}
async function graphGet(url,headers={}){
    const t=await getToken();
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+t,...headers}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
}

// ── Charger audits ──
async function loadAudits(){
    el('btn-load').disabled=true;
    el('btn-load').textContent='Chargement...';
    
    const C = COL_AUDITS;
    const select=[C.auditId,C.date,C.auditeurEmail,C.zone,C.niveau,
        C.s1_1,C.s1_2,C.s1_3,C.s2_1,C.s2_2,C.s2_3,C.s3_1,C.s3_2,C.s3_3,
        C.s4_1,C.s4_2,C.s4_3,C.s5_1,C.s5_2,C.s5_3,
        C.scoreTotal,C.scorePct,C.commentaire].join(',');
    
    const url=`https://graph.microsoft.com/v1.0/sites/${SITE_ID}/lists/${LIST_IDS.audits}/items?$expand=fields($select=${select})&$top=20`;
    const data=await graphGet(url);
    
    auditsData=(data.value||[]).map(item=>{
        const f=item.fields;
        return {
            id:item.id, auditId:f[C.auditId], date:f[C.date],
            auditeur:f[C.auditeurEmail]||'',
            zone:f[C.zone], niveau:f[C.niveau],
            scores:[f[C.s1_1]||0,f[C.s1_2]||0,f[C.s1_3]||0,f[C.s2_1]||0,f[C.s2_2]||0,f[C.s2_3]||0,
                    f[C.s3_1]||0,f[C.s3_2]||0,f[C.s3_3]||0,f[C.s4_1]||0,f[C.s4_2]||0,f[C.s4_3]||0,
                    f[C.s5_1]||0,f[C.s5_2]||0,f[C.s5_3]||0],
            scoreTotal:f[C.scoreTotal]||0, scorePct:f[C.scorePct]||0,
            commentaire:f[C.commentaire]||''
        };
    });
    
    // Trier par date desc
    auditsData.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    
    // Afficher la liste
    let html='';
    auditsData.forEach((a,i)=>{
        const date=a.date?new Date(a.date).toLocaleDateString('fr-FR'):'?';
        const pct=a.scorePct||0;
        const color=pct>=85?'#00AA46':pct>=70?'#F59100':pct>=50?'#FFED00':'#E60046';
        html+=`<div class="audit-card" onclick="selectAudit(${i})" id="ac-${i}">
            <div class="flex" style="justify-content:space-between">
                <div><strong>${esc(a.zone||'?')}</strong> — Niveau ${a.niveau||'?'}</div>
                <div style="font-weight:700;color:${color}">${pct}%</div>
            </div>
            <div style="font-size:.78rem;color:#777;margin-top:2px">${date} • ${esc(a.auditeur)} • ${esc(a.auditId||'')}</div>
            <div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
    });
    if(!auditsData.length) html='<div class="s err">Aucun audit trouvé dans la liste</div>';
    el('audits-list').innerHTML=html;
    el('btn-load').textContent='Charger les audits récents';
    el('btn-load').disabled=false;
}

async function selectAudit(index){
    document.querySelectorAll('.audit-card').forEach(c=>c.classList.remove('selected'));
    el('ac-'+index).classList.add('selected');
    selectedAudit=auditsData[index];
    
    // Charger les actions associées
    const C=COL_ACTIONS;
    const select=[C.actionId,C.dateCreation,C.zone,C.critere,C.type,C.description,C.statut,C.dateCloture,C.commentaireCloture].join(',');
    try{
        const url=`https://graph.microsoft.com/v1.0/sites/${SITE_ID}/lists/${LIST_IDS.actions}/items?$expand=fields($select=${select})&$filter=fields/Zone eq '${selectedAudit.zone}'&$top=50`;
        const data=await graphGet(url,{'Prefer':'HonorNonIndexedQueriesWarningMayFailRandomly'});
        selectedActions=(data.value||[]).map(item=>{
            const f=item.fields;
            return {
                actionId:f[C.actionId], zone:f[C.zone], critere:f[C.critere]||'',
                type:f[C.type]||'', description:f[C.description]||'',
                statut:f[C.statut]||'Ouverte', dateCloture:f[C.dateCloture]||''
            };
        });
    }catch(e){
        selectedActions=[];
    }
    
    // Aperçu
    const a=selectedAudit;
    const sScores=[];
    for(let i=0;i<5;i++){
        sScores.push(((a.scores[i*3]||0)+(a.scores[i*3+1]||0)+(a.scores[i*3+2]||0))/3);
    }
    
    let html=`<div class="preview">
        <h4>${esc(a.zone)} — Niveau ${a.niveau} — ${a.date?new Date(a.date).toLocaleDateString('fr-FR'):''}</h4>
        <p>Auditeur : ${esc(a.auditeur)} | Score : <strong>${a.scorePct}%</strong> (${a.scoreTotal}/60)</p>
        <div style="margin-top:8px">`;
    
    S_NAMES.forEach((name,i)=>{
        const val=sScores[i];
        const pct=Math.round(val/4*100);
        const color=pct>=85?'#00AA46':pct>=70?'#F59100':pct>=50?'#FFED00':'#E60046';
        html+=`<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.82rem">
            <span style="width:180px">${S_SHORT[i]} — ${name.split(' — ')[1]}</span>
            <div class="score-bar" style="flex:1"><div class="score-fill" style="width:${pct}%;background:${color}"></div></div>
            <span style="width:40px;text-align:right;font-weight:600">${val.toFixed(1)}/4</span>
        </div>`;
    });
    
    html+=`</div><p style="margin-top:8px;font-size:.82rem;color:#777">${selectedActions.length} action(s) associée(s)</p></div>`;
    
    el('audit-detail').innerHTML=html;
    el('detail-card').style.display='';
    el('btn-pdf').disabled=false;
}

// ═══════════════════════════════════════════════════════════════
// GÉNÉRATION PDF — jsPDF
// ═══════════════════════════════════════════════════════════════

function generatePDF(){
    if(!selectedAudit)return;
    const a=selectedAudit;
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,H=297;
    const margin=15;
    
    // Couleurs Sartorius
    const YELLOW=[255,237,0];
    const BLACK=[0,0,0];
    const GRAY50=[157,157,157];
    const GRAY80=[87,87,87];
    const GRAY10=[237,237,237];
    const WHITE=[255,255,255];
    const GREEN=[0,170,70];
    const ORANGE=[245,145,0];
    const RED=[230,0,70];
    
    const scoreColor=(pct)=>pct>=85?GREEN:pct>=70?ORANGE:pct>=50?YELLOW:RED;
    
    // ── Header band ──
    doc.setFillColor(...YELLOW);
    doc.rect(0,0,W,28,'F');
    
    doc.setFontSize(18);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLACK);
    doc.text('AUDIT 5S',margin,12);
    
    doc.setFontSize(10);
    doc.setFont('helvetica','normal');
    doc.text('Fiche synthèse',margin,18);
    
    // Date en haut à droite
    const dateStr=a.date?new Date(a.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'';
    doc.setFontSize(10);
    doc.text(dateStr,W-margin,12,{align:'right'});
    doc.text('Sartorius SCE — Pompey',W-margin,18,{align:'right'});
    
    // ── Info block ──
    let y=36;
    
    // Zone + Niveau (gros)
    doc.setFontSize(16);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLACK);
    doc.text(String(a.zone||''),margin,y);
    
    doc.setFontSize(11);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...GRAY80);
    const niveauX=margin+doc.getTextWidth(String(a.zone||'')+'  ');
    doc.text('Niveau '+String(a.niveau||''),margin+doc.getTextWidth(String(a.zone||''))+4,y);
    
    // Score circulaire (droite)
    const pct=a.scorePct||0;
    const scoreX=W-margin-18;
    const scoreY=y-4;
    const sc=scoreColor(pct);
    
    // Cercle de fond
    doc.setFillColor(...GRAY10);
    doc.circle(scoreX,scoreY,14,'F');
    // Arc coloré (simplifié : cercle plein coloré)
    doc.setFillColor(...sc);
    doc.circle(scoreX,scoreY,14,'F');
    // Centre blanc
    doc.setFillColor(...WHITE);
    doc.circle(scoreX,scoreY,11,'F');
    // Score text
    doc.setFontSize(16);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...sc);
    doc.text(pct+'%',scoreX,scoreY+2,{align:'center'});
    doc.setFontSize(7);
    doc.setTextColor(...GRAY50);
    doc.text(a.scoreTotal+'/60',scoreX,scoreY+7,{align:'center'});
    
    y+=8;
    doc.setFontSize(9);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...GRAY80);
    doc.text('Auditeur : '+String(a.auditeur||''),margin,y);
    
    // ── Ligne de séparation ──
    y+=6;
    doc.setDrawColor(...GRAY10);
    doc.setLineWidth(0.5);
    doc.line(margin,y,W-margin,y);
    
    // ── Scores par S — barres horizontales ──
    y+=8;
    doc.setFontSize(11);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLACK);
    doc.text('Scores par catégorie',margin,y);
    y+=6;
    
    const sScores=[];
    for(let i=0;i<5;i++){
        sScores.push(((a.scores[i*3]||0)+(a.scores[i*3+1]||0)+(a.scores[i*3+2]||0))/3);
    }
    
    const barLeft=margin+52;
    const barWidth=70;
    const barH=5;
    
    S_NAMES.forEach((name,i)=>{
        const val=sScores[i];
        const p=Math.round(val/4*100);
        const c=scoreColor(p);
        
        // Label
        doc.setFontSize(8);
        doc.setFont('helvetica','bold');
        doc.setTextColor(...BLACK);
        doc.text(S_SHORT[i],margin,y+3.5);
        doc.setFont('helvetica','normal');
        doc.setTextColor(...GRAY80);
        doc.text(name.split(' — ')[1],margin+8,y+3.5);
        
        // Barre de fond
        doc.setFillColor(...GRAY10);
        doc.roundedRect(barLeft,y,barWidth,barH,1.5,1.5,'F');
        
        // Barre de score
        const fillW=Math.max(barWidth*(val/4),2);
        doc.setFillColor(...c);
        doc.roundedRect(barLeft,y,fillW,barH,1.5,1.5,'F');
        
        // Valeur
        doc.setFontSize(8);
        doc.setFont('helvetica','bold');
        doc.setTextColor(...c);
        doc.text(val.toFixed(1)+'/4',barLeft+barWidth+3,y+3.5);
        
        y+=8;
    });
    
    // ── Radar chart (canvas → image) ──
    const radarX=W-margin-50;
    const radarY=62;
    const radarSize=42;
    
    drawRadarToPDF(doc, radarX, radarY, radarSize, sScores);
    
    // ── Détail des 15 critères ──
    y+=4;
    doc.setDrawColor(...GRAY10);
    doc.line(margin,y,W-margin,y);
    y+=6;
    
    doc.setFontSize(11);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLACK);
    doc.text('Détail des 15 critères',margin,y);
    y+=5;
    
    const criteriaNames = [
        'S1.1','S1.2','S1.3','S2.1','S2.2','S2.3',
        'S3.1','S3.2','S3.3','S4.1','S4.2','S4.3',
        'S5.1','S5.2','S5.3'
    ];
    
    // 3 colonnes de 5
    const colW=(W-2*margin)/3;
    for(let col=0;col<3;col++){
        const cx=margin+col*colW;
        let cy=y;
        for(let row=0;row<5;row++){
            const idx=col*5+row;
            if(idx>=15)break;
            const score=a.scores[idx]||0;
            const p=Math.round(score/4*100);
            const c=scoreColor(p);
            
            // Mini barre
            doc.setFontSize(7);
            doc.setFont('helvetica','normal');
            doc.setTextColor(...GRAY80);
            doc.text(criteriaNames[idx],cx,cy+3);
            
            const miniBarX=cx+12;
            const miniBarW=colW-22;
            doc.setFillColor(...GRAY10);
            doc.roundedRect(miniBarX,cy,miniBarW,3.5,1,1,'F');
            doc.setFillColor(...c);
            doc.roundedRect(miniBarX,cy,Math.max(miniBarW*(score/4),1),3.5,1,1,'F');
            
            doc.setFont('helvetica','bold');
            doc.setTextColor(...c);
            doc.text(String(score),cx+colW-6,cy+3);
            
            cy+=6;
        }
    }
    
    y+=34;
    
    // ── Actions ──
    doc.setDrawColor(...GRAY10);
    doc.line(margin,y,W-margin,y);
    y+=6;
    
    doc.setFontSize(11);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLACK);
    doc.text('Actions ('+selectedActions.length+')',margin,y);
    y+=5;
    
    if(selectedActions.length===0){
        doc.setFontSize(8);
        doc.setFont('helvetica','normal');
        doc.setTextColor(...GRAY50);
        doc.text('Aucune action associée',margin,y);
    } else {
        // En-tête tableau
        doc.setFillColor(...GRAY10);
        doc.rect(margin,y-1,W-2*margin,5,'F');
        doc.setFontSize(7);
        doc.setFont('helvetica','bold');
        doc.setTextColor(...GRAY80);
        doc.text('Type',margin+1,y+2.5);
        doc.text('Description',margin+28,y+2.5);
        doc.text('Statut',W-margin-20,y+2.5);
        y+=6;
        
        // Lignes
        const maxActions=Math.min(selectedActions.length,8); // Max 8 pour tenir sur 1 page
        for(let i=0;i<maxActions;i++){
            const act=selectedActions[i];
            doc.setFontSize(7);
            
            // Type (badge)
            const isEcart=(act.type||'').includes('cart');
            doc.setFont('helvetica','bold');
            doc.setTextColor(...(isEcart?RED:GREEN));
            doc.text(isEcart?'Écart':'Élévation',margin+1,y+2.5);
            
            // Description (tronquée)
            doc.setFont('helvetica','normal');
            doc.setTextColor(...BLACK);
            const desc=String(act.description||'').substring(0,70)+(act.description?.length>70?'…':'');
            doc.text(desc,margin+28,y+2.5);
            
            // Statut
            const statut=act.statut||'Ouverte';
            const stColor=statut==='Clôturée'?GREEN:statut==='Annulée'?GRAY50:statut==='En cours'?ORANGE:RED;
            doc.setFont('helvetica','bold');
            doc.setTextColor(...stColor);
            doc.text(statut,W-margin-20,y+2.5);
            
            // Ligne séparation
            y+=5;
            doc.setDrawColor(...GRAY10);
            doc.setLineWidth(0.2);
            doc.line(margin,y,W-margin,y);
            y+=1;
        }
        
        if(selectedActions.length>maxActions){
            doc.setFontSize(7);
            doc.setFont('helvetica','normal');
            doc.setTextColor(...GRAY50);
            doc.text('... et '+(selectedActions.length-maxActions)+' autre(s)',margin+1,y+3);
        }
    }
    
    // ── Commentaire ──
    if(a.commentaire){
        y+=8;
        doc.setDrawColor(...GRAY10);
        doc.line(margin,y,W-margin,y);
        y+=5;
        doc.setFontSize(8);
        doc.setFont('helvetica','bold');
        doc.setTextColor(...BLACK);
        doc.text('Commentaire',margin,y);
        y+=4;
        doc.setFont('helvetica','normal');
        doc.setTextColor(...GRAY80);
        const lines=doc.splitTextToSize(a.commentaire,W-2*margin);
        doc.text(lines,margin,y);
    }
    
    // ── Footer ──
    doc.setFontSize(7);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...GRAY50);
    doc.text('Sartorius SCE — Amélioration Continue — Généré le '+new Date().toLocaleDateString('fr-FR')+' '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),margin,H-8);
    doc.text('Audit 5S — '+String(a.auditId||''),W-margin,H-8,{align:'right'});
    
    // Ligne footer
    doc.setDrawColor(...YELLOW);
    doc.setLineWidth(1);
    doc.line(0,H-4,W,H-4);
    
    // ── Preview + Download ──
    const pdfBlob=doc.output('blob');
    const url=URL.createObjectURL(pdfBlob);
    const preview=el('pdf-preview');
    preview.src=url;
    preview.style.display='block';
    preview.style.height='500px';
    
    // Auto-download
    const filename='Audit_5S_'+String(a.zone||'').replace(/[^a-zA-Z]/g,'')+'_'+String(a.date||'').substring(0,10)+'.pdf';
    doc.save(filename);
}

// ── Radar chart directement dans le PDF ──
function drawRadarToPDF(doc, cx, cy, size, values){
    const n=5;
    const maxVal=4;
    const angleOffset=-Math.PI/2; // Commencer en haut
    
    // Grille de fond
    [0.25,0.5,0.75,1].forEach(level=>{
        const r=size*level;
        doc.setDrawColor(230,230,230);
        doc.setLineWidth(0.2);
        const pts=[];
        for(let i=0;i<n;i++){
            const angle=angleOffset+(2*Math.PI*i/n);
            pts.push([cx+r*Math.cos(angle), cy+r*Math.sin(angle)]);
        }
        for(let i=0;i<n;i++){
            doc.line(pts[i][0],pts[i][1],pts[(i+1)%n][0],pts[(i+1)%n][1]);
        }
    });
    
    // Axes
    doc.setDrawColor(200,200,200);
    for(let i=0;i<n;i++){
        const angle=angleOffset+(2*Math.PI*i/n);
        doc.line(cx,cy,cx+size*Math.cos(angle),cy+size*Math.sin(angle));
    }
    
    // Zone colorée (polygone des valeurs)
    const pts=[];
    for(let i=0;i<n;i++){
        const angle=angleOffset+(2*Math.PI*i/n);
        const r=size*(values[i]/maxVal);
        pts.push([cx+r*Math.cos(angle), cy+r*Math.sin(angle)]);
    }
    
    // Remplir le polygone (pas de méthode native polygon dans jsPDF, on trace manuellement)
    doc.setFillColor(255,237,0,0.3);
    doc.setDrawColor(255,237,0);
    doc.setLineWidth(0.8);
    
    // Dessiner le polygone via triangle fan
    for(let i=0;i<n;i++){
        const j=(i+1)%n;
        // Triangle: center → pt[i] → pt[j]
        doc.triangle(cx,cy, pts[i][0],pts[i][1], pts[j][0],pts[j][1], 'F');
    }
    // Contour
    for(let i=0;i<n;i++){
        const j=(i+1)%n;
        doc.line(pts[i][0],pts[i][1],pts[j][0],pts[j][1]);
    }
    
    // Points
    doc.setFillColor(255,237,0);
    pts.forEach(p=>{
        doc.circle(p[0],p[1],1,'F');
    });
    
    // Labels
    doc.setFontSize(7);
    doc.setFont('helvetica','bold');
    doc.setTextColor(60,60,60);
    for(let i=0;i<n;i++){
        const angle=angleOffset+(2*Math.PI*i/n);
        const lx=cx+(size+6)*Math.cos(angle);
        const ly=cy+(size+6)*Math.sin(angle);
        const align=Math.abs(Math.cos(angle))<0.1?'center':Math.cos(angle)>0?'left':'right';
        doc.text(S_SHORT[i],lx,ly+1,{align});
    }
}

function el(id){return document.getElementById(id);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
