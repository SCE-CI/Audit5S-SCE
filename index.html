<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Audit 5S</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <style>
        /* ── Écran : UI de sélection ── */
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}
        
        .ui-panel{max-width:650px;margin:0 auto;padding:20px}
        .ui-panel h1{font-size:1.3rem;margin-bottom:4px}
        .ui-sub{color:#777;font-size:.85rem;margin-bottom:16px}
        .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid #e0e0e0}
        .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        button{background:#FFED00;border:none;padding:8px 18px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.85rem}
        button:hover{background:#E6D600}
        button:disabled{opacity:.5;cursor:not-allowed}
        .s{padding:6px 10px;border-radius:5px;margin:3px 0;font-size:.82rem;font-family:Consolas,monospace}
        .s.ok{background:#e6f9ed;color:#00754a}.s.err{background:#fde8ee;color:#c4002f}.s.info{background:#e8f0fe;color:#1a5276}
        .audit-item{padding:10px;border:1px solid #eee;border-radius:6px;margin:4px 0;cursor:pointer;transition:all .15s}
        .audit-item:hover{background:#fafaf0;border-color:#ddd}
        .audit-item.selected{background:#FFED00;border-color:#E6D600}
        .score-bar-ui{height:6px;border-radius:3px;background:#eee;flex:1}
        .score-fill-ui{height:100%;border-radius:3px}

        /* ── Impression : page A4 du rapport ── */
        #report{display:none}

        @media print {
            body{background:#fff;margin:0;padding:0}
            .ui-panel{display:none !important}
            #report{display:block !important;width:210mm;margin:0 auto;padding:0;font-family:'Segoe UI',Arial,sans-serif;font-size:9pt;color:#333}
        }

        /* ── Report design (aussi visible en preview) ── */
        #report.preview-mode{display:block;width:210mm;margin:20px auto;padding:0;font-family:'Segoe UI',Arial,sans-serif;font-size:9pt;color:#333;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.12);border-radius:4px;overflow:hidden}

        .rpt-header{background:#FFED00;padding:10mm 12mm 7mm;display:flex;justify-content:space-between;align-items:flex-start}
        .rpt-title{font-size:18pt;font-weight:700;color:#000}
        .rpt-subtitle{font-size:9pt;color:#333;margin-top:1mm}
        .rpt-header-right{text-align:right;font-size:8pt;color:#333}
        
        .rpt-body{padding:6mm 12mm 4mm}
        
        .rpt-info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4mm}
        .rpt-zone{font-size:15pt;font-weight:700}
        .rpt-niveau{font-size:10pt;color:#575757;margin-left:3mm}
        .rpt-auditeur{font-size:8.5pt;color:#575757}
        
        .rpt-score-circle{width:28mm;height:28mm;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid}
        .rpt-score-pct{font-size:16pt;font-weight:700}
        .rpt-score-raw{font-size:7pt;color:#878787}

        .rpt-sep{border:none;border-top:.5px solid #DADADA;margin:3mm 0}
        
        .rpt-section-title{font-size:10pt;font-weight:700;margin-bottom:3mm}

        /* Score bars */
        .rpt-scores{display:flex;gap:6mm}
        .rpt-bars{flex:1}
        .rpt-bar-row{display:flex;align-items:center;margin-bottom:2mm;gap:2mm}
        .rpt-bar-label{width:38mm;font-size:7.5pt}
        .rpt-bar-label b{font-weight:700}
        .rpt-bar-track{flex:1;height:4mm;background:#EDEDED;border-radius:2mm}
        .rpt-bar-fill{height:100%;border-radius:2mm}
        .rpt-bar-val{width:12mm;text-align:right;font-size:7.5pt;font-weight:700}

        /* Radar */
        .rpt-radar{width:46mm;height:46mm;flex-shrink:0}
        .rpt-radar svg{width:100%;height:100%}

        /* Critères grid */
        .rpt-criteria{display:flex;gap:3mm}
        .rpt-criteria-col{flex:1}
        .rpt-crit-row{display:flex;align-items:center;gap:1.5mm;margin-bottom:1.2mm}
        .rpt-crit-name{width:9mm;font-size:6.5pt;color:#575757}
        .rpt-crit-track{flex:1;height:2.5mm;background:#EDEDED;border-radius:1mm}
        .rpt-crit-fill{height:100%;border-radius:1mm}
        .rpt-crit-val{width:5mm;font-size:6.5pt;font-weight:700;text-align:right}

        /* Actions table */
        .rpt-actions-table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-top:2mm}
        .rpt-actions-table th{background:#F5F5F5;padding:1.5mm 2mm;text-align:left;font-weight:700;border-bottom:.5px solid #DADADA}
        .rpt-actions-table td{padding:1.5mm 2mm;border-bottom:.3px solid #EDEDED;vertical-align:top}
        .rpt-type-ecart{color:#E60046;font-weight:700}
        .rpt-type-elev{color:#00AA46;font-weight:700}
        .rpt-statut{font-weight:700;font-size:7pt}

        /* Comment */
        .rpt-comment{font-size:8pt;color:#575757;margin-top:2mm;font-style:italic}

        /* Footer */
        .rpt-footer{margin-top:4mm;padding:3mm 12mm;border-top:2px solid #FFED00;display:flex;justify-content:space-between;font-size:6.5pt;color:#9D9D9D}

        @media print {
            .rpt-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
            .rpt-score-circle,.rpt-bar-fill,.rpt-crit-fill,.rpt-bar-track,.rpt-crit-track,.rpt-actions-table th,.rpt-footer{-webkit-print-color-adjust:exact;print-color-adjust:exact}
            @page{size:A4 portrait;margin:0}
        }
    </style>
</head>
<body>

<!-- ═══════════════════════ UI PANEL (écran) ═══════════════════════ -->
<div class="ui-panel">
    <h1>📄 Rapport PDF — Fiche synthèse Audit 5S</h1>
    <p class="ui-sub">Sélectionnez un audit pour générer le rapport imprimable.</p>

    <div class="card">
        <div class="flex">
            <button id="btn-connect" onclick="connect()">Se connecter</button>
            <span id="auth-status" class="s info">Non connecté</span>
        </div>
    </div>

    <div class="card">
        <button id="btn-load" onclick="loadAudits()" disabled>Charger les audits récents</button>
        <div id="audits-list" style="margin-top:8px"></div>
    </div>

    <div class="card" id="action-card" style="display:none">
        <div class="flex">
            <button onclick="showPreview()">Prévisualiser le rapport</button>
            <button onclick="printReport()" style="background:#000;color:#FFED00">Télécharger en PDF</button>
        </div>
        <p style="font-size:.78rem;color:#999;margin-top:6px">Le bouton "Télécharger" ouvre la boîte d'impression → choisir "Enregistrer en PDF"</p>
    </div>
</div>

<!-- ═══════════════════════ REPORT (impression) ═══════════════════════ -->
<div id="report"></div>

<script>
// ── Config ──
const SITE_ID='sartorius.sharepoint.com,ec2b83d2-7066-467c-83e6-fa97ca5db8e3,a833e672-c3d7-4db5-92c0-6169773c2516';
const LIST_IDS={audits:'fb669de2-4d64-49c7-a1cb-50a3b7ed79dc',actions:'aa10c625-373c-4d14-859a-3b468470cc3f'};

const CA={auditId:'Title',date:'Date',auditeurEmail:'AuditeurEmail',zone:'Zone',niveau:'Niveau',
    s1_1:'S1_1',s1_2:'S1_2',s1_3:'S1_3',s2_1:'S2_1',s2_2:'S2_2',s2_3:'S2_3',
    s3_1:'S3_1',s3_2:'S3_2',s3_3:'S3_3',s4_1:'S4_1',s4_2:'S4_2',s4_3:'S4_3',
    s5_1:'S5_1',s5_2:'S5_2',s5_3:'S5_3',scoreTotal:'ScoreTotal',scorePct:'ScorePct',commentaire:'Commentaire'};
const CX={actionId:'Title',zone:'Zone',critere:'Crit_x00e8_re',type:'TypeAction',description:'Description',
    statut:'Statut',dateCloture:'DateCloture',commentaireCloture:'CommentaireCloture'};

const S_LABELS=['Seiri — Trier','Seiton — Ranger','Seiso — Nettoyer','Seiketsu — Standardiser','Shitsuke — Respecter'];
const S_SHORT=['S1','S2','S3','S4','S5'];
const CRIT_NAMES=['S1.1','S1.2','S1.3','S2.1','S2.2','S2.3','S3.1','S3.2','S3.3','S4.1','S4.2','S4.3','S5.1','S5.2','S5.3'];

const msalConfig={auth:{clientId:'d97a32d2-865c-480b-96c2-1cfdcea3636c',authority:'https://login.microsoftonline.com/sartorius.com',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'sessionStorage'}};
const loginRequest={scopes:['Sites.ReadWrite.All']};
let msalInstance,msalAccount,auditsData=[],selectedAudit=null,selectedActions=[];

(async()=>{
    msalInstance=new msal.PublicClientApplication(msalConfig);
    await msalInstance.initialize();
    const a=msalInstance.getAllAccounts();
    if(a.length>0){msalAccount=a[0];onAuth();}
})();

async function connect(){try{const r=await msalInstance.loginPopup(loginRequest);msalAccount=r.account;onAuth();}catch(e){alert(e.message);}}
function onAuth(){el('auth-status').textContent='✓ '+msalAccount.username;el('auth-status').className='s ok';el('btn-load').disabled=false;}
async function getToken(){return(await msalInstance.acquireTokenSilent({scopes:loginRequest.scopes,account:msalAccount})).accessToken;}
async function graphGet(url,hdrs={}){const t=await getToken();const r=await fetch(url,{headers:{'Authorization':'Bearer '+t,...hdrs}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function el(id){return document.getElementById(id);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function scoreColor(pct){return pct>=85?'#00AA46':pct>=70?'#F59100':pct>=50?'#FFED00':'#E60046';}

// ── Charger audits ──
async function loadAudits(){
    el('btn-load').disabled=true;
    const sel=Object.values(CA).join(',');
    const url=`https://graph.microsoft.com/v1.0/sites/${SITE_ID}/lists/${LIST_IDS.audits}/items?$expand=fields($select=${sel})&$top=20`;
    const data=await graphGet(url);
    auditsData=(data.value||[]).map(it=>{
        const f=it.fields;
        return{id:it.id,auditId:f[CA.auditId],date:f[CA.date],auditeur:f[CA.auditeurEmail]||'',zone:f[CA.zone],niveau:f[CA.niveau],
            scores:[f[CA.s1_1]||0,f[CA.s1_2]||0,f[CA.s1_3]||0,f[CA.s2_1]||0,f[CA.s2_2]||0,f[CA.s2_3]||0,f[CA.s3_1]||0,f[CA.s3_2]||0,f[CA.s3_3]||0,f[CA.s4_1]||0,f[CA.s4_2]||0,f[CA.s4_3]||0,f[CA.s5_1]||0,f[CA.s5_2]||0,f[CA.s5_3]||0],
            scoreTotal:f[CA.scoreTotal]||0,scorePct:f[CA.scorePct]||0,commentaire:f[CA.commentaire]||''};
    }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    
    let h='';
    auditsData.forEach((a,i)=>{
        const d=a.date?new Date(a.date).toLocaleDateString('fr-FR'):'?';
        const c=scoreColor(a.scorePct);
        h+=`<div class="audit-item" onclick="selectAudit(${i})" id="ai${i}">
            <div class="flex" style="justify-content:space-between"><div><b>${esc(a.zone)}</b> — N${a.niveau}</div><div style="font-weight:700;color:${c}">${a.scorePct}%</div></div>
            <div style="font-size:.78rem;color:#999;margin-top:2px">${d} · ${esc(a.auditeur)} · ${esc(a.auditId||'')}</div>
            <div class="flex" style="margin-top:4px"><div class="score-bar-ui"><div class="score-fill-ui" style="width:${a.scorePct}%;background:${c}"></div></div></div>
        </div>`;
    });
    el('audits-list').innerHTML=h||'<div class="s err">Aucun audit</div>';
    el('btn-load').disabled=false;
}

async function selectAudit(i){
    document.querySelectorAll('.audit-item').forEach(c=>c.classList.remove('selected'));
    el('ai'+i).classList.add('selected');
    selectedAudit=auditsData[i];
    
    // Charger actions de cette zone
    try{
        const sel=Object.values(CX).join(',');
        const url=`https://graph.microsoft.com/v1.0/sites/${SITE_ID}/lists/${LIST_IDS.actions}/items?$expand=fields($select=${sel})&$filter=fields/Zone eq '${selectedAudit.zone}'&$top=50`;
        const data=await graphGet(url,{'Prefer':'HonorNonIndexedQueriesWarningMayFailRandomly'});
        selectedActions=(data.value||[]).map(it=>{const f=it.fields;return{actionId:f[CX.actionId],critere:f[CX.critere]||'',type:f[CX.type]||'',description:f[CX.description]||'',statut:f[CX.statut]||'Ouverte',dateCloture:f[CX.dateCloture]||''};});
    }catch(e){selectedActions=[];}
    
    el('action-card').style.display='';
}

// ── Construire le HTML du rapport ──
function buildReport(){
    const a=selectedAudit;
    if(!a)return;
    const pct=a.scorePct||0;
    const color=scoreColor(pct);
    const dateStr=a.date?new Date(a.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'';
    
    // Scores par S
    const sS=[];
    for(let i=0;i<5;i++) sS.push(((a.scores[i*3]||0)+(a.scores[i*3+1]||0)+(a.scores[i*3+2]||0))/3);
    
    let h=`
    <div class="rpt-header">
        <div><div class="rpt-title">AUDIT 5S</div><div class="rpt-subtitle">Fiche synthèse</div></div>
        <div class="rpt-header-right">${esc(dateStr)}<br>Sartorius SCE — Pompey</div>
    </div>
    <div class="rpt-body">
        <div class="rpt-info-row">
            <div><span class="rpt-zone">${esc(a.zone)}</span><span class="rpt-niveau">Niveau ${a.niveau}</span><br><span class="rpt-auditeur">Auditeur : ${esc(a.auditeur)}</span></div>
            <div class="rpt-score-circle" style="border-color:${color}">
                <div class="rpt-score-pct" style="color:${color}">${pct}%</div>
                <div class="rpt-score-raw">${a.scoreTotal}/60</div>
            </div>
        </div>
        <hr class="rpt-sep">
        <div class="rpt-section-title">Scores par catégorie</div>
        <div class="rpt-scores">
            <div class="rpt-bars">`;
    
    // Barres S
    S_LABELS.forEach((label,i)=>{
        const v=sS[i];
        const p=Math.round(v/4*100);
        const c=scoreColor(p);
        h+=`<div class="rpt-bar-row">
            <div class="rpt-bar-label"><b>${S_SHORT[i]}</b> ${label.split(' — ')[1]}</div>
            <div class="rpt-bar-track"><div class="rpt-bar-fill" style="width:${p}%;background:${c}"></div></div>
            <div class="rpt-bar-val" style="color:${c}">${v.toFixed(1)}/4</div>
        </div>`;
    });
    
    // Radar SVG
    h+=`</div><div class="rpt-radar">${buildRadarSVG(sS)}</div></div>`;
    
    // Critères détail
    h+=`<hr class="rpt-sep"><div class="rpt-section-title">Détail des 15 critères</div><div class="rpt-criteria">`;
    for(let col=0;col<3;col++){
        h+=`<div class="rpt-criteria-col">`;
        for(let row=0;row<5;row++){
            const idx=col*5+row;
            const v=a.scores[idx]||0;
            const p=Math.round(v/4*100);
            const c=scoreColor(p);
            h+=`<div class="rpt-crit-row">
                <div class="rpt-crit-name">${CRIT_NAMES[idx]}</div>
                <div class="rpt-crit-track"><div class="rpt-crit-fill" style="width:${p}%;background:${c}"></div></div>
                <div class="rpt-crit-val" style="color:${c}">${v}</div>
            </div>`;
        }
        h+=`</div>`;
    }
    h+=`</div>`;
    
    // Actions
    h+=`<hr class="rpt-sep"><div class="rpt-section-title">Actions (${selectedActions.length})</div>`;
    if(selectedActions.length>0){
        h+=`<table class="rpt-actions-table"><tr><th>Type</th><th>Description</th><th style="width:18mm">Statut</th></tr>`;
        selectedActions.slice(0,10).forEach(act=>{
            const isE=(act.type||'').includes('cart');
            const stColor=act.statut==='Clôturée'?'#00AA46':act.statut==='Annulée'?'#9D9D9D':act.statut==='En cours'?'#F59100':'#E60046';
            h+=`<tr>
                <td class="${isE?'rpt-type-ecart':'rpt-type-elev'}">${isE?'Écart':'Élévation'}</td>
                <td>${esc((act.description||'').substring(0,90))}${act.description?.length>90?'…':''}</td>
                <td class="rpt-statut" style="color:${stColor}">${esc(act.statut)}</td>
            </tr>`;
        });
        if(selectedActions.length>10) h+=`<tr><td colspan="3" style="color:#9D9D9D;font-style:italic">… et ${selectedActions.length-10} autre(s)</td></tr>`;
        h+=`</table>`;
    } else {
        h+=`<div style="color:#9D9D9D;font-size:8pt">Aucune action associée</div>`;
    }
    
    // Commentaire
    if(a.commentaire){
        h+=`<hr class="rpt-sep"><div class="rpt-section-title">Commentaire</div><div class="rpt-comment">${esc(a.commentaire)}</div>`;
    }
    
    h+=`</div>`; // fin rpt-body
    
    // Footer
    const now=new Date();
    h+=`<div class="rpt-footer">
        <div>Sartorius SCE — Amélioration Continue — Généré le ${now.toLocaleDateString('fr-FR')} ${now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
        <div>${esc(a.auditId||'')}</div>
    </div>`;
    
    el('report').innerHTML=h;
}

// ── Radar SVG ──
function buildRadarSVG(values){
    const n=5, max=4, cx=90, cy=90, size=70;
    const angle=i=>-Math.PI/2+(2*Math.PI*i/n);
    const pt=(i,r)=>[cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i))];
    
    let svg=`<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">`;
    
    // Grille
    [.25,.5,.75,1].forEach(lv=>{
        const r=size*lv;
        let pts='';for(let i=0;i<n;i++){const p=pt(i,r);pts+=`${p[0]},${p[1]} `;}
        svg+=`<polygon points="${pts}" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>`;
    });
    
    // Axes
    for(let i=0;i<n;i++){const p=pt(i,size);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#D0D0D0" stroke-width="0.3"/>`;}
    
    // Zone de valeur
    let pts='';
    for(let i=0;i<n;i++){const p=pt(i,size*(values[i]/max));pts+=`${p[0]},${p[1]} `;}
    svg+=`<polygon points="${pts}" fill="rgba(255,237,0,0.35)" stroke="#FFED00" stroke-width="1.5"/>`;
    
    // Points
    for(let i=0;i<n;i++){const p=pt(i,size*(values[i]/max));svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#FFED00" stroke="#000" stroke-width="0.5"/>`;}
    
    // Labels
    for(let i=0;i<n;i++){
        const p=pt(i,size+12);
        const anchor=Math.abs(Math.cos(angle(i)))<0.15?'middle':Math.cos(angle(i))>0?'start':'end';
        const dy=Math.sin(angle(i))<-0.3?-2:Math.sin(angle(i))>0.3?6:2;
        svg+=`<text x="${p[0]}" y="${p[1]+dy}" text-anchor="${anchor}" font-size="8" font-weight="700" fill="#575757">${S_SHORT[i]}</text>`;
        svg+=`<text x="${p[0]}" y="${p[1]+dy+9}" text-anchor="${anchor}" font-size="6" fill="#9D9D9D">${values[i].toFixed(1)}/4</text>`;
    }
    
    svg+=`</svg>`;
    return svg;
}

// ── Preview & Print ──
function showPreview(){
    buildReport();
    el('report').classList.add('preview-mode');
    el('report').scrollIntoView({behavior:'smooth'});
}

function printReport(){
    buildReport();
    el('report').classList.remove('preview-mode');
    window.print();
}
</script>
</body>
</html>
