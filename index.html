<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint Explorer - Debug</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #FFED00; margin-bottom: 10px; }
        .status { 
            padding: 10px 15px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            font-weight: 500;
        }
        .status.connected { background: #2d4a3e; color: #4ade80; }
        .status.disconnected { background: #4a2d2d; color: #f87171; }
        .status.loading { background: #4a4a2d; color: #fbbf24; }
        
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #252540;
            border-radius: 8px;
        }
        .breadcrumb span { color: #888; }
        .breadcrumb button {
            background: none;
            border: none;
            color: #60a5fa;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .breadcrumb button:hover { background: #333355; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary { background: #FFED00; color: #000; }
        .btn-primary:hover { background: #e6d600; }
        .btn-secondary { background: #333355; color: #fff; }
        .btn-secondary:hover { background: #444466; }
        
        .file-list {
            background: #252540;
            border-radius: 12px;
            overflow: hidden;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #333355;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-item:hover { background: #333355; }
        .file-item:last-child { border-bottom: none; }
        .file-item.folder { color: #fbbf24; }
        .file-item.file { color: #60a5fa; }
        .file-icon { font-size: 20px; width: 30px; text-align: center; }
        .file-name { flex: 1; font-weight: 500; }
        .file-meta { color: #888; font-size: 12px; }
        .file-id { 
            font-family: monospace; 
            font-size: 10px; 
            color: #666;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .info-box {
            background: #252540;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }
        .info-box h3 { margin: 0 0 10px 0; color: #FFED00; }
        .info-box pre {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            color: #4ade80;
        }
        .info-box code {
            color: #60a5fa;
        }
        
        .empty { 
            padding: 40px; 
            text-align: center; 
            color: #888; 
        }
        
        #log {
            background: #0a0a15;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        #log .entry { margin-bottom: 5px; }
        #log .error { color: #f87171; }
        #log .success { color: #4ade80; }
        #log .info { color: #60a5fa; }
    </style>
</head>
<body>
    <h1>🔍 SharePoint Explorer</h1>
    
    <div id="status" class="status disconnected">Non connecté</div>
    
    <div class="controls">
        <button class="btn-primary" onclick="connect()">Se connecter</button>
        <button class="btn-secondary" onclick="goToRoot()">Racine du Drive</button>
        <button class="btn-secondary" onclick="testPath()">Tester un chemin</button>
    </div>
    
    <div class="breadcrumb" id="breadcrumb">
        <button onclick="goToRoot()">🏠 Root</button>
    </div>
    
    <div class="file-list" id="fileList">
        <div class="empty">Connectez-vous pour explorer SharePoint</div>
    </div>
    
    <div class="info-box">
        <h3>📋 Infos utiles</h3>
        <div id="pathInfo">
            <p>Chemin actuel : <code id="currentPath">-</code></p>
            <p>Item ID : <code id="currentId">-</code></p>
            <p>URL Graph pour copier :</p>
            <pre id="graphUrl">-</pre>
        </div>
    </div>
    
    <div id="log"></div>

    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <script>
        // Config MSAL - IDENTIQUE à l'app principale
        const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        const getRedirectUri = () => {
            if (isLocalDev) {
                return window.location.origin + '/';
            }
            return 'https://sce-ci.github.io/Audit5S-SCE/';
        };
        
        const msalConfig = {
            auth: {
                clientId: 'd97a32d2-865c-480b-96c2-1cfdcea3636c',
                authority: 'https://login.microsoftonline.com/sartorius.com',
                redirectUri: getRedirectUri(),
                navigateToLoginRequestUrl: false,
                postLogoutRedirectUri: getRedirectUri()
            },
            cache: {
                cacheLocation: 'localStorage',
                storeAuthStateInCookie: true
            },
            system: {
                allowNativeBroker: false,
                windowHashTimeout: 60000,
                iframeHashTimeout: 6000,
                loadFrameTimeout: 0
            }
        };
        
        const loginRequest = {
            scopes: ['Files.ReadWrite', 'Sites.ReadWrite.All']
        };
        
        const driveId = 'b!0oMr7GZwfEaD5vqXyl2443LmM6jXw7VNksBhaXc8JRZ31jhxZcPFTIJo67mbwfL5';
        
        let msalInstance = null;
        let accessToken = null;
        let currentItemId = null;
        let pathStack = []; // [{name, id}]
        
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.insertBefore(entry, logEl.firstChild);
        }
        
        async function connect() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status loading';
            statusEl.textContent = 'Connexion en cours...';
            
            try {
                msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();
                
                const accounts = msalInstance.getAllAccounts();
                let account = accounts[0];
                
                if (!account) {
                    const loginResponse = await msalInstance.loginPopup(loginRequest);
                    account = loginResponse.account;
                }
                
                const tokenResponse = await msalInstance.acquireTokenSilent({
                    scopes: loginRequest.scopes,
                    account: account
                });
                
                accessToken = tokenResponse.accessToken;
                
                statusEl.className = 'status connected';
                statusEl.textContent = `✅ Connecté : ${account.username}`;
                log('Connexion réussie', 'success');
                
                goToRoot();
                
            } catch (error) {
                statusEl.className = 'status disconnected';
                statusEl.textContent = `❌ Erreur : ${error.message}`;
                log(`Erreur connexion: ${error.message}`, 'error');
            }
        }
        
        async function goToRoot() {
            if (!accessToken) {
                log('Non connecté', 'error');
                return;
            }
            
            pathStack = [];
            currentItemId = null;
            await loadFolder('root');
        }
        
        async function loadFolder(itemId) {
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = '<div class="empty">Chargement...</div>';
            
            try {
                let url;
                if (itemId === 'root') {
                    url = `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children?$select=id,name,folder,file,lastModifiedDateTime&$top=100`;
                } else {
                    url = `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/children?$select=id,name,folder,file,lastModifiedDateTime&$top=100`;
                }
                
                log(`GET ${url.substring(0, 100)}...`);
                document.getElementById('graphUrl').textContent = url;
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                const items = data.value || [];
                
                log(`${items.length} éléments trouvés`, 'success');
                
                currentItemId = itemId;
                updateBreadcrumb();
                updatePathInfo();
                renderItems(items);
                
            } catch (error) {
                fileListEl.innerHTML = `<div class="empty">❌ Erreur: ${error.message}</div>`;
                log(`Erreur: ${error.message}`, 'error');
            }
        }
        
        function renderItems(items) {
            const fileListEl = document.getElementById('fileList');
            
            if (items.length === 0) {
                fileListEl.innerHTML = '<div class="empty">Dossier vide</div>';
                return;
            }
            
            // Trier : dossiers d'abord, puis fichiers
            items.sort((a, b) => {
                if (a.folder && !b.folder) return -1;
                if (!a.folder && b.folder) return 1;
                return a.name.localeCompare(b.name);
            });
            
            let html = '';
            for (const item of items) {
                const isFolder = !!item.folder;
                const icon = isFolder ? '📁' : '📄';
                const date = item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).toLocaleDateString('fr') : '';
                
                html += `
                    <div class="file-item ${isFolder ? 'folder' : 'file'}" 
                         onclick="${isFolder ? `navigateTo('${item.id}', '${item.name.replace(/'/g, "\\'")}')` : `selectFile('${item.id}', '${item.name.replace(/'/g, "\\'")}')`}">
                        <span class="file-icon">${icon}</span>
                        <span class="file-name">${item.name}</span>
                        <span class="file-meta">${date}</span>
                        <span class="file-id" title="${item.id}">${item.id.substring(0, 20)}...</span>
                    </div>
                `;
            }
            
            fileListEl.innerHTML = html;
        }
        
        function navigateTo(itemId, name) {
            pathStack.push({ id: currentItemId, name: name });
            loadFolder(itemId);
        }
        
        function selectFile(itemId, name) {
            log(`Fichier sélectionné: ${name} (ID: ${itemId})`, 'info');
            
            // Construire le chemin complet
            const pathParts = pathStack.map(p => p.name);
            pathParts.push(name);
            const fullPath = pathParts.join('/');
            
            alert(`Fichier: ${name}\n\nChemin: ${fullPath}\n\nID: ${itemId}`);
        }
        
        function goBack(index) {
            if (index === -1) {
                goToRoot();
                return;
            }
            
            const target = pathStack[index];
            pathStack = pathStack.slice(0, index);
            loadFolder(target.id || 'root');
        }
        
        function updateBreadcrumb() {
            const el = document.getElementById('breadcrumb');
            let html = '<button onclick="goBack(-1)">🏠 Root</button>';
            
            pathStack.forEach((item, idx) => {
                html += `<span>/</span><button onclick="goBack(${idx})">${item.name}</button>`;
            });
            
            el.innerHTML = html;
        }
        
        function updatePathInfo() {
            const pathParts = pathStack.map(p => p.name);
            document.getElementById('currentPath').textContent = '/' + pathParts.join('/');
            document.getElementById('currentId').textContent = currentItemId || 'root';
        }
        
        async function testPath() {
            if (!accessToken) {
                log('Non connecté', 'error');
                return;
            }
            
            const path = prompt('Entrez le chemin à tester (ex: Audits 5S/Audits traités/Process Entrée):');
            if (!path) return;
            
            log(`Test du chemin: ${path}`);
            
            // Méthode 1: encodeURI simple
            const url1 = `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodeURI(path)}:/children`;
            log(`Méthode 1 (encodeURI): ${url1}`);
            
            try {
                const r1 = await fetch(url1, { headers: { 'Authorization': `Bearer ${accessToken}` }});
                if (r1.ok) {
                    const data = await r1.json();
                    log(`✅ Méthode 1 OK! ${data.value?.length || 0} items`, 'success');
                } else {
                    log(`❌ Méthode 1: ${r1.status}`, 'error');
                }
            } catch (e) {
                log(`❌ Méthode 1: ${e.message}`, 'error');
            }
            
            // Méthode 2: encodeURIComponent par segment
            const encodedPath = path.split('/').map(s => encodeURIComponent(s)).join('/');
            const url2 = `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodedPath}:/children`;
            log(`Méthode 2 (segment): ${url2}`);
            
            try {
                const r2 = await fetch(url2, { headers: { 'Authorization': `Bearer ${accessToken}` }});
                if (r2.ok) {
                    const data = await r2.json();
                    log(`✅ Méthode 2 OK! ${data.value?.length || 0} items`, 'success');
                } else {
                    log(`❌ Méthode 2: ${r2.status}`, 'error');
                }
            } catch (e) {
                log(`❌ Méthode 2: ${e.message}`, 'error');
            }
        }
    </script>
</body>
</html>
